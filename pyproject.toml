[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protohunter"
version = "0.9.0"
description = "Local Android protocol, endpoint, Protobuf and Smali static-analysis workbench"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
protohunter = "protohunter.cli:main"

[tool.setuptools.package-data]
protohunter = ["static/*", "demo.smali"]

[tool.setuptools.packages.find]
include = ["protohunter*"]
